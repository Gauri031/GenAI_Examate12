# GitHub Actions: runs on every push to main and on every pull request into main.
# This file MUST live at the repo root (.github/workflows/ci.yml). The project is in the day12 folder.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: day12

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: day12/requirements-dev.txt
      - name: Install packages
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t poshanguide:ci .
      - name: Start the container and check /health
        run: |
          docker run -d --name poshanguide -p 8000:8000 poshanguide:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "health check OK"
              exit 0
            fi
            sleep 2
          done
          docker logs poshanguide
          exit 1
